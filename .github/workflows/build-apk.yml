name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          if [ ! -f settings.gradle ] && ls *.zip >/dev/null 2>&1; then
            unzip -o "$(ls *.zip | head -1)" -d .
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk MurdhiServer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MurdhiServer-apk
          path: MurdhiServer.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Murdhi's Server (build ${{ github.run_number }})
          files: MurdhiServer.apk
